<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>GuiT3 - Emscripten</title>
  <style>
    body,
    html {
      font-family: arial;
      margin: 0;
      padding: 0;
      background-color: #282a36;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      font-weight: bold;
      color: #eff0eb;
    }

    #progress {
      position: absolute;
      top: 34px;
      left: 10px;
      height: 16px;
      width: 300px;
    }

    .spinner {
      position: absolute;
      top: 10px;
      left: 320px;
      height: 20px;
      width: 20px;

      -webkit-animation: rotation .8s linear infinite;
      animation: rotation 0.8s linear infinite;

      border-left: 4px solid rgb(235, 235, 235);
      border-right: 4px solid rgb(235, 235, 235);
      border-bottom: 4px solid rgb(235, 235, 235);
      border-top: 4px solid rgb(120, 120, 120);

      border-radius: 100%;
    }

    @keyframes rotation {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    #canvas {
      display: block;
      margin: 0;
      padding: 0;
      border: 0px none;
      background-color: black;
      width: 100%;
      height: 100%;
    }

    /*
     * A WebUI game's user interface (webui-emscripten-plan.md step 6): the
     * game's own HTML pages, served by the VM through the Service Worker,
     * shown in a frame over the whole canvas while the game runs. A frame
     * rather than a new tab keeps this page visible - browsers throttle a
     * hidden tab's timers, and the VM runs on them.
     */
    #webui-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background-color: #282a36;
    }

    #webui-overlay[hidden] {
      display: none;
    }

    #webui-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 4px 0 12px;
      color: #eff0eb;
      font-size: 14px;
      flex: none;
    }

    #webui-title {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #webui-close {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    #webui-close:hover,
    #webui-close:focus-visible {
      background-color: #44475a;
    }

    #webui-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background-color: white;
    }
  </style>
</head>

<body>
  <div class="emscripten" id="status">Downloading...</div>
  <progress class="emscripten" id="progress" value="0" max="100"></progress>
  <div class="spinner" id="spinner"></div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <div id="webui-overlay" hidden>
    <div id="webui-bar">
      <span id="webui-title"></span>
      <button id="webui-close" type="button" title="Close the game" aria-label="Close the game">&times;</button>
    </div>
    <iframe id="webui-frame" title="Game"></iframe>
  </div>

  <script type="text/javascript">
    // By default this page loads tests/ditch3.t3, packaged by
    // htmltads/htmltads/imgui/CMakeLists.txt's em_package(ditch3game ...)
    // call as ditch3game.data/.js (mapped to the virtual path ditch3.t3
    // guit3's own argv references below). It also loads guit3fonts.data/.js,
    // that same CMakeLists.txt's em_package(guit3fonts ...) packaging of
    // ../../imgui/misc/fonts (mapped to the virtual path "fonts" emfont.cpp
    // scans for the Customize Theme dialog's font lists), and
    // guit3charmap.data/.js, packaging tads3/charmap/cmaplib.t3r (mapped to
    // "charmap/cmaplib.t3r" - guios_portable.cpp's character-encoding
    // conversions fall back to ASCII-only without it), and guit3about.data/
    // .js, packaging the private-resources guit3.t3r (the About box's
    // background image) to the virtual path "guit3.t3r". It also loads
    // guit3-webui-bridge.js, the page half of the WebUI transport (see the
    // comment above that script tag).
    //
    // ?game=webtest loads tests/Webtest.t3 instead (em_package(webuitest
    // ...), webuitest.data/.js - built by the default "all" target, not by
    // --target guit3 alone), a WebUI game for exercising the WebUI
    // transport and the overlay below.
    var games = {
      ditch3: { pkg: 'ditch3game.js', file: 'ditch3.t3' },
      webtest: { pkg: 'webuitest.js', file: 'Webtest.t3' },
      // only if configured with -DGUIT3_EXTRA_TEST_GAME=... (CMakeLists.txt)
      extra: { pkg: 'guit3extragame.js', file: 'extra.t3' },
    };
    var game = games[new URLSearchParams(location.search).get('game')] || games.ditch3;
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var canvasElement = document.getElementById('canvas');

    // As a default initial behavior, pop up an alert when the WebGL context
    // is lost. To make your application robust, you may want to override
    // this behavior before shipping!
    // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);

    var Module = {
      arguments: [game.file],
      canvas: canvasElement,
      print(...args) {
        console.log(args.join(' '));
      },
      printErr(...args) {
        console.error(args.join(' '));
      },
      setStatus(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // if this is a progress update, skip it if too soon
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = 'none';
        }
        statusElement.innerHTML = text;
      },
      totalDependencies: 0,
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = () => {
      Module.setStatus('Exception thrown, see JavaScript console');
      spinnerElement.style.display = 'none';
      Module.setStatus = (text) => {
        if (text) console.error('[post-exception status] ' + text);
      };
    };
  </script>
  <!-- WebUI transport (webui-emscripten-plan.md step 4): registers
       guit3-webui-sw.js and relays the requests it catches to the VM's
       loopback connections. Needs this page served from the site root over
       http(s) (http://localhost is fine) - Service Workers are unavailable
       from file:// - but plain non-WebUI games don't depend on it. -->
  <script src="guit3-webui-bridge.js"></script>
  <script>
    Guit3WebUIBridge.start().catch((e) => console.warn('guit3: WebUI games unavailable: ' + e));

    // The WebUI host (webui-emscripten-plan.md step 6). guit3's launch hook
    // (guit3_webui_launch_hook(), guit3.cpp) calls Module.onWebUILaunch()
    // once a WebUI game has started its HTTP server; show the game's start
    // page in the overlay frame, once the Service Worker routes it to the
    // VM. Closing the overlay is the local "UI window closed" event: tell
    // the VM (osnet_webui_closed(), tads3/unix/osnetunix.cpp), which posts
    // TadsUICloseEvent - lib/webui.t then ends the game, just as closing
    // the browser window does natively. The frame's own pagehide beacon
    // (/webui/clientClose) says the same thing less reliably.
    var webuiOverlay = document.getElementById('webui-overlay');
    var webuiFrame = document.getElementById('webui-frame');
    var webuiTitle = document.getElementById('webui-title');
    var webuiTitleTimer = null;

    Module.onWebUILaunch = function (port, path) {
      Guit3WebUIBridge.whenRouted().then(() => {
        webuiFrame.src = path;
        webuiTitle.textContent = '';
        webuiOverlay.hidden = false;
        webuiFrame.focus();
        // mirror the game's window title (the WebUI sets it from getState)
        clearInterval(webuiTitleTimer);
        webuiTitleTimer = setInterval(() => {
          try {
            webuiTitle.textContent = webuiFrame.contentDocument.title;
          } catch (e) { }
        }, 1000);
      }, (e) => {
        console.error('guit3: cannot show this WebUI game: ' + e);
        Module.setStatus('This game needs Service Workers, which are unavailable here');
      });
    };

    document.getElementById('webui-close').addEventListener('click', () => {
      clearInterval(webuiTitleTimer);
      webuiOverlay.hidden = true;
      webuiFrame.src = 'about:blank';
      if (Module._osnet_webui_closed)
        Module._osnet_webui_closed();
      canvasElement.focus();
    });
  </script>
  <script>
    document.write('<script src="' + game.pkg + '"><\/script>');
  </script>
  <script src="guit3fonts.js"></script>
  <script src="guit3charmap.js"></script>
  <script src="guit3about.js"></script>
  <script async src="guit3.js"></script>
</body>

</html>
