<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>GuiT3 - Emscripten</title>
  <style>
    body,
    html {
      font-family: arial;
      margin: 0;
      padding: 0;
      background-color: #282a36;
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      top: 10px;
      left: 10px;
      font-weight: bold;
      color: #eff0eb;
    }

    #progress {
      position: absolute;
      top: 34px;
      left: 10px;
      height: 16px;
      width: 300px;
    }

    .spinner {
      position: absolute;
      top: 10px;
      left: 320px;
      height: 20px;
      width: 20px;

      -webkit-animation: rotation .8s linear infinite;
      animation: rotation 0.8s linear infinite;

      border-left: 4px solid rgb(235, 235, 235);
      border-right: 4px solid rgb(235, 235, 235);
      border-bottom: 4px solid rgb(235, 235, 235);
      border-top: 4px solid rgb(120, 120, 120);

      border-radius: 100%;
    }

    @keyframes rotation {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
    #canvas {
      display: block;
      margin: 0;
      padding: 0;
      border: 0px none;
      background-color: black;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="emscripten" id="status">Downloading...</div>
  <progress class="emscripten" id="progress" value="0" max="100"></progress>
  <div class="spinner" id="spinner"></div>

  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script type="text/javascript">
    // This page always loads tests/ditch3.t3, packaged by
    // htmltads/htmltads/imgui/CMakeLists.txt's em_package(ditch3game ...)
    // call as ditch3game.data/.js (mapped to the virtual path ditch3.t3
    // guit3's own argv references below).
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var spinnerElement = document.getElementById('spinner');
    var canvasElement = document.getElementById('canvas');

    // As a default initial behavior, pop up an alert when the WebGL context
    // is lost. To make your application robust, you may want to override
    // this behavior before shipping!
    // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
    canvasElement.addEventListener('webglcontextlost', (e) => {
      alert('WebGL context lost. You will need to reload the page.');
      e.preventDefault();
    }, false);

    var Module = {
      arguments: ['ditch3.t3'],
      canvas: canvasElement,
      print(...args) {
        console.log(args.join(' '));
      },
      printErr(...args) {
        console.error(args.join(' '));
      },
      setStatus(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // if this is a progress update, skip it if too soon
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          progressElement.value = parseInt(m[2]) * 100;
          progressElement.max = parseInt(m[4]) * 100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = 'none';
        }
        statusElement.innerHTML = text;
      },
      totalDependencies: 0,
      monitorRunDependencies(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading...');
    window.onerror = () => {
      Module.setStatus('Exception thrown, see JavaScript console');
      spinnerElement.style.display = 'none';
      Module.setStatus = (text) => {
        if (text) console.error('[post-exception status] ' + text);
      };
    };
  </script>
  <script src="ditch3game.js"></script>
  <script async src="guit3.js"></script>
</body>

</html>
