name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to the ref this workflow runs on)'
        required: false
      draft:
        description: 'Create as a draft release (for testing, not publicly visible)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: htmltads
      - uses: actions/checkout@v7
        with:
          repository: captain-mayhem/tads-runner
          path: tads-runner
      - run: cmake --preset windows-only -DCMAKE_BUILD_TYPE=Release
        working-directory: tads-runner
      - run: cmake --build build/default --config Release
        working-directory: tads-runner
      - name: Package
        working-directory: tads-runner/build/default
        run: cpack
      - uses: actions/upload-artifact@v4
        with:
          name: htmltads-windows
          path: tads-runner/build/default/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          generate_release_notes: true
          files: dist/**/*.zip
